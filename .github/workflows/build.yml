name: VCam Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.2.11394342 cmake;3.22.1 platforms;android-34 build-tools;34.0.0'

      - name: Install system dependencies and fix CRLF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build zip dos2unix
          find . -type f -name "*.sh" -exec dos2unix {} +
          dos2unix gradlew
          chmod +x build_all.sh gradlew module/*.sh

      - name: Build ALL
        run: |
          export NDK_DIR=$ANDROID_HOME/ndk/26.2.11394342
          export SDK_DIR=$ANDROID_HOME
          bash ./build_all.sh

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: vcam-module
          path: out/vcam-*-module.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vcam-apk
          path: out/VCam-*-release.apk

      - name: Release (en tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/vcam-*-module.zip
            out/VCam-*-release.apk
